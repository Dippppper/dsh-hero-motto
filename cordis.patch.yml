# Three rows: the core (package root) carries the shared browser half; the two
# feature components are subpath rows and can each be toggled independently.
# The core row must stay enabled for any of the bundle's UI to exist.
- insert:
    - id: hero-motto-core
      name: 'dsh-hero-motto'
    - id: hero-motto
      name: 'dsh-hero-motto/motto'
    - id: hero-motto-marquee
      name: 'dsh-hero-motto/marquee'
